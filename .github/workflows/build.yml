name: CI

on:
  pull_request:
    paths-ignore:
    - '**.md'
  workflow_dispatch:
  push:
    tags:
    - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Building xcframeworks
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false

    - name: xcode-version
      run: xcodebuild -version

    - name: build-ios_system
      run: swift run --verbose --package-path xcfs build

    - name: Slices and checksums
      run: |
        ls .build/*.xcframework.zip >/dev/null
        for zip in .build/*.xcframework.zip; do
          sum=$(swift package compute-checksum "$zip")
          echo "$sum  $(basename "$zip")"
        done | tee .build/checksums.txt
        for xcf in .build/*/*.xcframework; do
          for slice in ios-arm64 ios-arm64_x86_64-simulator; do
            [ -d "$xcf/$slice" ] || { echo "::error::$xcf has no $slice slice"; exit 1; }
          done
        done
        {
          echo '| xcframework | slice | archs |'
          echo '| --- | --- | --- |'
          for lib in .build/*/*.xcframework/*/*; do
            case "$lib" in *.framework|*.a|*.dylib) ;; *) continue ;; esac
            bin="$lib"
            [ -d "$lib" ] && bin="$lib/$(basename "${lib%.framework}")"
            [ -f "$bin" ] || continue
            archs=$(lipo -archs "$bin")
            echo "| $(basename "$(dirname "$(dirname "$lib")")") | $(basename "$(dirname "$lib")") | $archs |"
          done
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload xcframeworks
      uses: actions/upload-artifact@v7
      with:
        name: xcframeworks
        include-hidden-files: true
        if-no-files-found: error
        path: |
          .build/*.xcframework.zip
          .build/checksums.txt
          .build/release.md
          ios_error.h
          Resources/commandDictionary.plist

  release:
    name: Publishing release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: xcframeworks

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
          || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Release $GITHUB_REF_NAME" --notes-file .build/release.md
        gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
          .build/*.xcframework.zip ios_error.h Resources/commandDictionary.plist
