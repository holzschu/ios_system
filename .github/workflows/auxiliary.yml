name: Auxiliary xcframeworks
on:
  pull_request:
    paths:
      - 'build-auxiliary.sh'
      - 'ci/auxiliary/**'
      - 'ci/audit-artifact.py'
      - '.github/workflows/auxiliary.yml'
  workflow_dispatch:
  push:
    branches:
      - 'ci/auxiliary-frameworks-refresh'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Exercise build paths that contain spaces.
          path: source checkout
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Build and audit XCFrameworks
        working-directory: source checkout
        run: |
          xcodebuild -version
          bash build-auxiliary.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcframeworks
          include-hidden-files: true
          if-no-files-found: error
          path: |
            source checkout/.build/auxiliary/*.xcframework.zip
            source checkout/.build/auxiliary/*.audit.json
            source checkout/.build/auxiliary/checksums.txt
            source checkout/.build/auxiliary/*.exports.txt
